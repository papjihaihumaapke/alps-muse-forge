[build]
  command = "bun run build"
  publish = "dist/client"

[[redirects]]
  from = "/_build/*"
  to = "/_build/:splat"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/*"
  to = "/_shell.html"
  status = 200
